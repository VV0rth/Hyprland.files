[colors]
background = #181210
foreground = #ede0dc
accent = #ffb59d
muted = #d8c2bb
surface = #251e1c

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 32
radius = 8
background = ${colors.background}
foreground = ${colors.foreground}
override-redirect = true
wm-restack = generic
font-0 = Cantarell:size=10;2
font-1 = DejaVu Sans:size=10;2
padding = 2
module-margin = 1
modules-left = launcher workspaces title
modules-center = date
modules-right = cpu memory battery volume backlight wifi tray
separator = "  "
separator-foreground = ${colors.muted}
scroll-up = swaymsg workspace prev
scroll-down = swaymsg workspace next

[module/launcher]
type = custom/text
content = Apps
content-foreground = ${colors.accent}
click-left = rofi -show drun

[module/workspaces]
type = custom/script
exec = ~/.config/polybar/sway-status workspaces
interval = 1

[module/title]
type = custom/script
exec = ~/.config/polybar/sway-status title
interval = 1
label-maxlen = 36

[module/date]
type = internal/date
interval = 5
date = %a %b %d
time = %H:%M
label = %date%   %time%
label-foreground = ${colors.accent}

[module/cpu]
type = internal/cpu
interval = 3
label = CPU %percentage%%

[module/memory]
type = internal/memory
interval = 5
label = RAM %percentage_used%%

[module/battery]
type = custom/script
exec = ~/.config/polybar/sway-status battery
interval = 15

[module/volume]
type = internal/pulseaudio
label-volume = Vol %percentage%%
label-muted = Muted
label-muted-foreground = ${colors.muted}
use-ui-max = false

[module/backlight]
type = internal/backlight
card = amdgpu_bl0
label = Light %percentage%%

[module/wifi]
type = internal/network
interface-type = wireless
interval = 5
label-connected = Wi-Fi %signal%%
label-disconnected = Wi-Fi off
label-disconnected-foreground = ${colors.muted}

[module/tray]
type = internal/tray
tray-spacing = 6px
