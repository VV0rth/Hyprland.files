# SwayFX 0.6: performance-focused Hyprland appearance.
corner_radius 10
smart_corner_radius disable
blur enable
blur_xray enable
blur_radius 3
blur_passes 2
# Hyprland's default blur color adjustments.
blur_noise 0.0117
blur_brightness 0.8172
blur_contrast 0.8916
blur_saturation 1.0
# Skip shadow rendering; keep rounded corners and lightweight background blur.
shadows disable
shadows_on_csd disable
shadow_blur_radius 4
shadow_color #1a1a1aee
shadow_inactive_color #1a1a1aee
shadow_offset 0 0
# Transparency is controlled by the focus/fullscreen IPC helper below.
# Dimming darkens content rather than making it transparent; leave it off.
default_dim_inactive 0
# Instant window changes avoid animation latency and intermediate frames.
animation_duration_ms 0
exec_always ~/.config/wm-common/swayfx-opacity.py

# Match Noctalia's namespace family. Preserve the shell's own corner geometry
# and avoid shadows around its large transparent layer surfaces.
# Bar namespaces include output names; the IPC helper discovers them exactly.
layer_effects "noctalia-notification" {
    blur enable;
    blur_ignore_transparent enable;
}
layer_effects "noctalia-dock" {
    blur enable;
    blur_ignore_transparent enable;
}
layer_effects "noctalia-panel" {
    blur enable;
    blur_ignore_transparent enable;
}
layer_effects "noctalia-attached-panel" {
    blur enable;
    blur_ignore_transparent enable;
}
layer_effects "noctalia-osd" {
    blur enable;
    blur_ignore_transparent enable;
}
layer_effects "noctalia-window-switcher" {
    blur enable;
    blur_ignore_transparent enable;
}
