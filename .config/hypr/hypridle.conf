general {
    before_sleep_cmd = noctalia msg session lock    # lock before suspend.
}
listener {
    timeout = 340                                # 5min.
    on-timeout = noctalia msg session lock & sleep 3 & brightnessctl -s set 10  # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}
